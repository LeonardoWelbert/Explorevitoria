<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fale Conosco | Explore Vitória</title>
    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body class="bg-dark text-white page-home">
    <div id="header-container"></div>

    <div
      id="hero-banner-container"
      class="hero-banner--contact"
      data-badge="CONTATO"
      data-title="FALE COM O EXPLORE VITÓRIA"
      data-text="Viver tecnologia é o que nos move para transformar sua infraestrutura digital com segurança, performance e inovação."
    ></div>

    <!-- Sobre nós -->
    <div class="section-wrapper">
      <section class="about-section">
        <div class="container">
          <div class="row align-items-center g-5">
            <div class="col-lg-7 order-2 order-lg-1">
              <div class="about-section__image-wrap">
                <img
                  src="assets/img/dd8d2d26f14e2000ea4fa08a5491eb58739ac966.png"
                  alt=""
                  class="section-wrapper__watermark"
                />
                <picture>
                  <source
                    srcset="assets/img/banner-fale-conosco.avif"
                    type="image/avif"
                  />
                  <source
                    srcset="assets/img/banner-fale-conosco.webp"
                    type="image/webp"
                  />
                  <img
                    src="assets/img/banner-fale-conosco.png"
                    alt="Equipe VNET trabalhando"
                    class="about-section__photo"
                  />
                </picture>
              </div>
            </div>

            <div class="col-lg-5 order-1 order-lg-2">
              <span class="about-section__badge">CONTATO</span>
              <h2 class="about-section__title">Viva o futuro</h2>
              <p class="about-section__text">
                Entre em contato e descubra como a tecnologia pode impulsionar
                novas oportunidades para o seu negócio.
              </p>

              <form class="contact-form" id="contactForm" novalidate>
                <div class="contact-form__group">
                  <input
                    type="text"
                    id="name"
                    name="name"
                    class="contact-form__input"
                    placeholder="Nome*"
                    required
                  />
                </div>

                <div class="contact-form__group">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="contact-form__input"
                    placeholder="E-mail*"
                    required
                  />
                </div>

                <div class="contact-form__group">
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    class="contact-form__input"
                    placeholder="Telefone/WhatsApp*"
                    required
                  />
                </div>

                <div class="contact-form__group">
                  <textarea
                    id="message"
                    name="message"
                    class="contact-form__textarea"
                    placeholder="Mensagem"
                    rows="4"
                  ></textarea>
                </div>

                <div class="contact-form__footer">
                  <div class="contact-form__captcha">
                    <div
                      class="g-recaptcha"
                      data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
                    ></div>
                  </div>

                  <button
                    type="submit"
                    class="btn btn-primary contact-form__submit"
                  >
                    Enviar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
